name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Verify generated dependency manifests
        run: |
          uv lock
          if ! git diff --quiet -- pyproject.toml uv.lock || [ -n "$(git status --porcelain -- pyproject.toml uv.lock)" ]; then
            echo "::error::Generated dependency manifests are stale. Run 'uv lock' and commit the updated uv.lock."
            git status --short -- pyproject.toml uv.lock
            git diff -- pyproject.toml uv.lock
            exit 1
          fi
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/
