name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  docker-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker final stage network policy
        run: python3 scripts/validate_docker_network_policy.py
      - name: Build runtime image with network-disabled final stage
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --target runtime -t agent-orchestrator:ci .
