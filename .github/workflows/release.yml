name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build, attest, and publish package artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected_tag = f"v{pyproject['project']['version']}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag} does not match {expected_tag}"
              )
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package distributions
        run: uv build

      - name: Create repository source archive
        run: |
          git archive \
            --format=tar.gz \
            --prefix="AgentOrchestration-${GITHUB_REF_NAME}/" \
            --output="dist/AgentOrchestration-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_SHA}"

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: agent-orchestrator-release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
